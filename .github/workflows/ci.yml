name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  idf-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware for esp32p4
        run: |
          docker run --rm -v "$PWD":/work -w /work/firmware espressif/idf:release-v6.0 \
            bash -lc 'git config --global --add safe.directory "*" && idf.py set-target esp32p4 && idf.py build'
