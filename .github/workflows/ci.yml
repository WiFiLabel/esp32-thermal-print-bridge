name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  idf-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build firmware for esp32p4
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD":/work -w /work/firmware espressif/idf:release-v6.0 \
            bash -lc 'git config --global --add safe.directory "*" && idf.py set-target esp32p4 && idf.py build && idf.py merge-bin -o /work/dist/wifilabel-esp32p4-merged.bin && cp build/print_esp32_p4_nano.bin /work/dist/wifilabel-esp32p4-app.bin'
          cd dist
          sha256sum wifilabel-esp32p4-app.bin wifilabel-esp32p4-merged.bin > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: wifilabel-esp32p4
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: idf-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wifilabel-esp32p4
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
